name: Android CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build APK (Debug)
      run: ./gradlew assembleDebug  # 构建调试版APK

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
          name: TVBox-Debug-APK
          path: app/build/outputs/apk/debug/*.apk  # APK生成路径
